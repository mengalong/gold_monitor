name: 项目测试

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 检查 Python 语法
        run: python -m compileall -q .

      - name: 运行测试
        run: pytest -q
